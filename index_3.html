<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>園區九米道路植物位置導覽圖</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    .svg-container {
      width: 100%;
      height: 100%;   /* viewport height 這一行是「填滿手機螢幕」的關鍵 */
      display: flex;
      justify-context: center;
      align-items: flex-start;
      overflow: auto;
    }

    object {
      width: 100%;
      height: auto;
      max-width: 1400px;
    }
  </style>
</head>

<body>

  <div class="svg-container">
    <object data="園區道路樹木_路徑圖.svg"
            type="image/svg+xml">
    </object>
  </div>

</body>
</html>
